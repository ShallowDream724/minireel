name: minireel
description: MiniReel · 沉浸式短剧播放器。Android 首发，架构支持后续 Windows 扩展。
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_staggered_grid_view: ^0.7.0
  media_kit: ^1.2.6
  media_kit_libs_android_video: ^1.3.8
  media_kit_video: ^2.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  screen_brightness: ^2.1.11
  sqflite: ^2.4.2+1
  volume_controller: ^3.5.0
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.9.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/config/sources.json
